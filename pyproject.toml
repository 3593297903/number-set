[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "number-tool"
version = "2.0.0"
requires-python = ">=3.13,<3.14"
dependencies = ["PySide6==6.12.0"]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-qt==4.5.0", "pyinstaller==6.22.3", "psutil==7.2.2"]

[project.scripts]
number-tool = "number_app.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
qt_api = "pyside6"
